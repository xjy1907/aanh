			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "#!/bin/bash\n# Inline Pack IPA (same as wasd) - no external CRLF file dependency\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:$PATH\"\necho \"[Pack IPA] begin PLATFORM=${PLATFORM_NAME} CONFIG=${CONFIGURATION}\"\nif [ \"${PLATFORM_NAME}\" != \"iphoneos\" ]; then\n  echo \"[Pack IPA] skip non-device build\"\n  exit 0\nfi\nAPP_PATH=\"${CODESIGNING_FOLDER_PATH}\"\nPROJECT_DIR=\"${SRCROOT}\"\nENTITLEMENTS_PATH=\"${PROJECT_DIR}/supports/entitlements.plist\"\nOUTPUT_DIR=\"${HOME}/Desktop/ipa\"\nIPA_NAME=\"abnh.ipa\"\necho \"[Pack IPA] APP_PATH=${APP_PATH}\"\necho \"[Pack IPA] ENTITLEMENTS=${ENTITLEMENTS_PATH}\"\necho \"[Pack IPA] OUTPUT=${OUTPUT_DIR}/${IPA_NAME}\"\nif [ -z \"${APP_PATH}\" ] || [ ! -d \"${APP_PATH}\" ]; then\n  echo \"[Pack IPA] ERROR: app not found. Use Any iOS Device + Scheme Books\"\n  exit 1\nfi\nif [ ! -f \"${ENTITLEMENTS_PATH}\" ]; then\n  echo \"[Pack IPA] ERROR: missing entitlements: ${ENTITLEMENTS_PATH}\"\n  exit 1\nfi\nif ! command -v ldid >/dev/null 2>&1; then\n  echo \"[Pack IPA] ERROR: ldid not found. Run: brew install ldid\"\n  exit 1\nfi\nTEMP_DIR=$(mktemp -d)\ntrap \"rm -rf ${TEMP_DIR}\" EXIT\nmkdir -p \"${OUTPUT_DIR}\"\nrm -f \"${OUTPUT_DIR}/${IPA_NAME}\"\nmkdir -p \"${TEMP_DIR}/Payload\"\ncp -R \"${APP_PATH}\" \"${TEMP_DIR}/Payload/\"\nAPP_NAME=$(basename \"${APP_PATH}\")\nCOPIED_APP=\"${TEMP_DIR}/Payload/${APP_NAME}\"\nchmod -R 755 \"${COPIED_APP}\"\nEXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c \"Print :CFBundleExecutable\" \"${COPIED_APP}/Info.plist\" 2>/dev/null || true)\nif [ -z \"${EXECUTABLE_NAME}\" ]; then\n  echo \"[Pack IPA] ERROR: CFBundleExecutable missing\"\n  exit 1\nfi\nEXECUTABLE_PATH=\"${COPIED_APP}/${EXECUTABLE_NAME}\"\nif [ ! -f \"${EXECUTABLE_PATH}\" ]; then\n  echo \"[Pack IPA] ERROR: binary missing: ${EXECUTABLE_PATH}\"\n  exit 1\nfi\necho \"[Pack IPA] signing with ldid...\"\nif ! ldid -S\"${ENTITLEMENTS_PATH}\" \"${EXECUTABLE_PATH}\"; then\n  echo \"[Pack IPA] ERROR: ldid sign failed\"\n  exit 1\nfi\n# also try sign whole app (ignore failure)\nldid -S\"${ENTITLEMENTS_PATH}\" \"${COPIED_APP}\" 2>/dev/null || true\necho \"[Pack IPA] zipping...\"\ncd \"${TEMP_DIR}\"\n/usr/bin/zip -qr \"${IPA_NAME}\" Payload\nmv \"${TEMP_DIR}/${IPA_NAME}\" \"${OUTPUT_DIR}/${IPA_NAME}\"\nFILE_SIZE=$(du -h \"${OUTPUT_DIR}/${IPA_NAME}\" | cut -f1)\necho \"[Pack IPA] OK ${OUTPUT_DIR}/${IPA_NAME} (${FILE_SIZE})\"\nexit 0\n";
